<div class="toast-host" aria-live="polite" aria-atomic="false">
  @for (toast of toasts; track toast.id) {
    <div class="hrms-toast" [class]="'toast-' + toast.type" role="alert">
      <span class="toast-icon">{{ iconFor(toast.type) }}</span>
      <span class="toast-body">{{ toast.message }}</span>
      <button class="toast-close" (click)="dismiss(toast.id)" aria-label="Dismiss">✕</button>
    </div>
  }
</div>
